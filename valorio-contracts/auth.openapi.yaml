openapi: 3.0.3
info:
  title: Valorio - API Authentification & IA
  description: Contrat des modules Authentification (Module 1), AI Code Assistant et AI Testing & Quality Assurance - service-auth (:8084).
  version: 1.0.0
servers:
  - url: http://localhost:8084
tags:
  - name: auth
    description: Inscription, Connexion, Rafraîchissement JWT et gestion de session
  - name: ai
    description: Assistance au développement, génération de tests et audit de qualité logiciel
paths:
  /api/auth/register:
    post:
      tags: [auth]
      summary: Inscription d'un nouvel utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        "201":
          description: Inscription réussie, jeton d'accès et utilisateur retournés
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        "400":
          description: Validation échouée ou mots de passe non concordants
        "409":
          description: Adresse email déjà existante

  /api/auth/login:
    post:
      tags: [auth]
      summary: Authentification et création de session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        "401":
          description: Identifiants invalides

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Renouvellement du jeton d'accès via rotation du refresh token
      responses:
        "200":
          description: Jeton renouvelé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        "401":
          description: Session expirée ou jeton révoqué

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Révocation de la session et suppression du cookie HTTP-Only
      responses:
        "200":
          description: Déconnexion confirmée

  /api/auth/me:
    get:
      tags: [auth]
      summary: Informations sur l'utilisateur actuellement connecté
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profil utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "401":
          description: Non authentifié

  /api/ai/code-generation:
    post:
      tags: [ai]
      summary: Génération de code assistée par IA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeGenerationRequest'
      responses:
        "200":
          description: Code généré et suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeGenerationResponse'

  /api/ai/tests/generate:
    post:
      tags: [ai]
      summary: Génération de tests unitaires et détection des cas limites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestGenerationRequest'
      responses:
        "200":
          description: Suite de tests générée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestGenerationResponse'

  /api/ai/code-review:
    post:
      tags: [ai]
      summary: Revue critique de code et détection de défauts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeReviewRequest'
      responses:
        "200":
          description: Rapport de revue de code

  /api/ai/quality-report:
    post:
      tags: [ai]
      summary: Rapport d'assurance qualité unifiant analyse statique et IA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualityReportRequest'
      responses:
        "200":
          description: Rapport qualité détaillé

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [nom, prenom, email, password, confirmPassword, termsAccepted]
      properties:
        nom: { type: string }
        prenom: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 12 }
        confirmPassword: { type: string }
        termsAccepted: { type: boolean }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        rememberMe: { type: boolean }

    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string }
        expiresIn: { type: integer }
        user: { $ref: '#/components/schemas/UserResponse' }

    UserResponse:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        nom: { type: string }
        prenom: { type: string }
        nomComplet: { type: string }
        role: { type: string, enum: [USER, ADMIN] }
        emailVerifie: { type: boolean }
        actif: { type: boolean }

    CodeGenerationRequest:
      type: object
      required: [task, language]
      properties:
        task: { type: string }
        language: { type: string }
        context: { type: string }

    CodeGenerationResponse:
      type: object
      properties:
        code: { type: string }
        language: { type: string }
        explanation: { type: string }
        assumptions: { type: array, items: { type: string } }
        potentialRisks: { type: array, items: { type: string } }
        suggestedImprovements: { type: array, items: { type: string } }

    TestGenerationRequest:
      type: object
      required: [code, language]
      properties:
        code: { type: string }
        language: { type: string }
        framework: { type: string }
        testType: { type: string }
        context: { type: string }

    TestGenerationResponse:
      type: object
      properties:
        generatedTests: { type: string }
        framework: { type: string }
        explanation: { type: string }
        testCasesCovered: { type: array, items: { type: string } }
        edgeCases: { type: array, items: { type: string } }
        suggestions: { type: array, items: { type: string } }

    CodeReviewRequest:
      type: object
      required: [code, language]
      properties:
        code: { type: string }
        language: { type: string }
        context: { type: string }

    QualityReportRequest:
      type: object
      required: [code, language]
      properties:
        code: { type: string }
        language: { type: string }
        includeStaticAnalysis: { type: boolean }
        includeAiReview: { type: boolean }
