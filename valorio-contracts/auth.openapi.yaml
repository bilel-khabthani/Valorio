openapi: 3.0.3
info:
  title: Valorio - API Authentification
  description: Contrat du module Authentification & Sécurité (Module 1) - service-auth (:8084).
  version: 1.0.0
servers:
  - url: http://localhost:8084
tags:
  - name: auth
    description: Inscription, Connexion, Rafraîchissement JWT, Récupération de mot de passe et gestion de session
paths:
  /api/auth/register:
    post:
      tags: [auth]
      summary: Inscription d'un nouvel utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        "201":
          description: Inscription réussie, jeton d'accès et utilisateur retournés
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        "400":
          description: Validation échouée ou mots de passe non concordants
        "409":
          description: Adresse email déjà existante

  /api/auth/login:
    post:
      tags: [auth]
      summary: Authentification et création de session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        "401":
          description: Identifiants invalides

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Renouvellement du jeton d'accès via rotation du refresh token
      responses:
        "200":
          description: Jeton renouvelé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        "401":
          description: Session expirée ou jeton révoqué

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Révocation de la session et suppression du cookie HTTP-Only
      responses:
        "200":
          description: Déconnexion confirmée

  /api/auth/me:
    get:
      tags: [auth]
      summary: Informations sur l'utilisateur actuellement connecté
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profil utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "401":
          description: Non authentifié

  /api/auth/forgot-password:
    post:
      tags: [auth]
      summary: Demande de lien de réinitialisation de mot de passe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        "200":
          description: Email expédié si le compte existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/auth/reset-password:
    post:
      tags: [auth]
      summary: Réinitialisation du mot de passe par jeton
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        "200":
          description: Mot de passe mis à jour avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "400":
          description: Jeton invalide ou expiré

  /api/auth/verify-email:
    post:
      tags: [auth]
      summary: Confirmation de l'adresse email par jeton
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Email vérifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/auth/resend-verification:
    post:
      tags: [auth]
      summary: Réexpédition de l'email de confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Email réexpédié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [nom, prenom, email, password, confirmPassword, termsAccepted]
      properties:
        nom: { type: string }
        prenom: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 12 }
        confirmPassword: { type: string }
        termsAccepted: { type: boolean }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        rememberMe: { type: boolean }

    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string }
        expiresIn: { type: integer }
        user: { $ref: '#/components/schemas/UserResponse' }

    UserResponse:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        nom: { type: string }
        prenom: { type: string }
        nomComplet: { type: string }
        role: { type: string, enum: [USER, ADMIN] }
        emailVerifie: { type: boolean }
        actif: { type: boolean }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, newPassword, confirmPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, minLength: 12 }
        confirmPassword: { type: string }

    MessageResponse:
      type: object
      properties:
        message: { type: string }
        success: { type: boolean }
        devLink: { type: string }
