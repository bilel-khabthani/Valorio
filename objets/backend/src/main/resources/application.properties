# =============================================
# Lost & Found - Configuration Spring Boot
# =============================================

# Server
server.port=8081

# PostgreSQL - Modifier username/password si besoin
spring.datasource.url=jdbc:postgresql://localhost:5432/lostandfound
spring.datasource.username=postgres
spring.datasource.password=louay
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Multipart (photo upload) - max 10MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Servir les images uploadees depuis le dossier local
spring.web.resources.static-locations=file:uploads/,classpath:/static/

# Jackson - serialisation des dates
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd

# Logging
logging.level.com.lostandfound=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Afficher message de demarrage
spring.main.banner-mode=console
