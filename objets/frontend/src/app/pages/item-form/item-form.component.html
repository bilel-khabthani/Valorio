<div class="item-form-page">
  <div class="page-header">
    <a routerLink="/items" class="back-link">← Retour</a>
    <h1>{{ formTitle }}</h1>
  </div>

  @if (loading) {
    <div class="loading-spinner">
      <div class="spinner"></div>
      <p>Chargement...</p>
    </div>
  }

  @if (!loading) {
    <div class="form-card">
      @if (error) {
        <div class="alert alert-error">{{ error }}</div>
      }

      <form (ngSubmit)="onSubmit()" #f="ngForm">

        <!-- Type -->
        <div class="form-section">
          <h3>Type d'objet</h3>
          <div class="type-toggle">
            <label [class.selected]="item.type === 'LOST'">
              <input type="radio" name="type" [(ngModel)]="item.type" value="LOST" />
              <span class="type-option type-lost">❌ Objet perdu</span>
            </label>
            <label [class.selected]="item.type === 'FOUND'">
              <input type="radio" name="type" [(ngModel)]="item.type" value="FOUND" />
              <span class="type-option type-found">✅ Objet trouvé</span>
            </label>
          </div>
        </div>

        <!-- Informations principales -->
        <div class="form-section">
          <h3>Informations de l'objet</h3>
          <div class="form-grid">
            <div class="form-group full">
              <label for="title">Titre <span class="required">*</span></label>
              <input id="title" type="text" [(ngModel)]="item.title" name="title"
                     placeholder="Ex: iPhone 13 noir, Sac à main marron..." required />
            </div>

            <div class="form-group">
              <label for="category">Catégorie <span class="required">*</span></label>
              <select id="category" [(ngModel)]="item.category" name="category" required>
                <option value="">-- Sélectionner --</option>
                @for (cat of categories; track cat) {
                  <option [value]="cat">{{ cat }}</option>
                }
              </select>
            </div>

            <div class="form-group">
              <label for="location">Localisation <span class="required">*</span></label>
              <input id="location" type="text" [(ngModel)]="item.location" name="location"
                     placeholder="Ex: Gare centrale, Rue Victor Hugo..." required />
            </div>

            <div class="form-group">
              <label for="date">Date <span class="required">*</span></label>
              <input id="date" type="date" [(ngModel)]="item.date" name="date" required />
            </div>

            @if (isEditMode) {
              <div class="form-group">
                <label for="status">Statut</label>
                <select id="status" [(ngModel)]="item.status" name="status">
                  <option value="ACTIVE">Actif</option>
                  <option value="CLAIMED">Réclamé</option>
                  <option value="RETURNED">Restitué</option>
                </select>
              </div>
            }

            <div class="form-group full">
              <label for="description">Description</label>
              <textarea id="description" [(ngModel)]="item.description" name="description"
                        rows="4" placeholder="Décrivez l'objet : couleur, marque, état, signes distinctifs..."></textarea>
            </div>
          </div>
        </div>

        <!-- Déclarant -->
        <div class="form-section">
          <h3>Vos coordonnées (optionnel)</h3>
          <div class="form-grid">
            <div class="form-group">
              <label for="reporterName">Votre nom</label>
              <input id="reporterName" type="text" [(ngModel)]="item.reporterName" name="reporterName"
                     placeholder="Prénom Nom" />
            </div>
            <div class="form-group">
              <label for="reporterContact">Contact (email ou téléphone)</label>
              <input id="reporterContact" type="text" [(ngModel)]="item.reporterContact" name="reporterContact"
                     placeholder="email@exemple.com ou 06..." />
            </div>
          </div>
        </div>

        <!-- Photo -->
        <div class="form-section">
          <h3>Photo (optionnel)</h3>
          <div class="photo-upload">
            @if (previewUrl) {
              <div class="photo-preview">
                <img [src]="previewUrl" alt="Aperçu" />
                <button type="button" class="remove-photo" (click)="removePhoto()">✕</button>
              </div>
            } @else {
              <label class="upload-area" for="photo">
                <span class="upload-icon">📷</span>
                <span>Cliquer pour ajouter une photo</span>
                <span class="upload-hint">JPG, PNG, GIF — max 10 Mo</span>
                <input id="photo" type="file" accept="image/*" (change)="onFileChange($event)" hidden />
              </label>
            }
          </div>
        </div>

        <!-- Actions -->
        <div class="form-actions">
          <a routerLink="/items" class="btn btn-secondary">Annuler</a>
          <button type="submit" class="btn btn-primary" [disabled]="saving">
            @if (saving) { <span class="btn-spinner"></span> Enregistrement... }
            @else { {{ isEditMode ? '💾 Enregistrer les modifications' : '✅ Déclarer l\'objet' }} }
          </button>
        </div>
      </form>
    </div>
  }
</div>
