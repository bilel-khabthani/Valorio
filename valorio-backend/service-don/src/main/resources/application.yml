spring:
  application:
    name: service-don
  datasource:
    url: jdbc:postgresql://localhost:5432/valorio?currentSchema=don
    username: ${DB_USER:postgres}
    password: ${DB_PASS:bilel}
  flyway:
    enabled: true
    schemas: don
    default-schema: don
    create-schemas: true

server:
  port: 8082

valorio:
  objets:
    base-url: ${OBJETS_URL:http://localhost:8085}
  auth:
    base-url: ${AUTH_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
