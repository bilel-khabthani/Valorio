spring.application.name=marketplace
server.port=8085

# Default In-Memory DB with PostgreSQL compatibility mode for instant zero-dependency execution
spring.datasource.url=jdbc:h2:mem:marketplacedb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console enabled for inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# AI Configuration (Hybrid: built-in local intelligent heuristic engine + optional OpenAI/Gemini API key)
marketplace.ai.provider=hybrid
marketplace.ai.api-key=${AI_API_KEY:}
marketplace.ai.model=gpt-4o-mini
