spring:
  application:
    name: service-reparation
  datasource:
    url: jdbc:postgresql://localhost:5432/valorio?currentSchema=reparation
    username: ${DB_USER:postgres}
    password: ${DB_PASS:bilel}
  flyway:
    enabled: true
    schemas: reparation
    default-schema: reparation
    create-schemas: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
