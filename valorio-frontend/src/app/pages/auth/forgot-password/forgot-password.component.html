<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-badge">Récupération</div>
      <h1>Mot de passe oublié</h1>
      <p>Entrez votre email pour recevoir les instructions de réinitialisation</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-error" role="alert">
        {{ errorMessage() }}
      </div>
    }

    @if (successMessage()) {
      <div class="alert alert-success" role="alert">
        {{ successMessage() }}
      </div>
    }

    <form class="auth-form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="reset-email">Adresse email</label>
        <input
          id="reset-email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="votre.email@exemple.com"
          required
          autocomplete="email"
        />
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner"></span> Envoi en cours...
        } @else {
          Envoyer le lien de réinitialisation
        }
      </button>

      <div class="auth-footer">
        <a routerLink="/login" class="link-register">← Retour à la connexion</a>
      </div>
    </form>
  </div>
</div>
