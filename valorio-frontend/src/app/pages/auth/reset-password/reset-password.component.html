<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-badge">Sécurité</div>
      <h1>Nouveau mot de passe</h1>
      <p>Définissez un nouveau mot de passe robuste pour votre compte</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-error" role="alert">
        {{ errorMessage() }}
      </div>
    }

    @if (successMessage()) {
      <div class="alert alert-success" role="alert">
        {{ successMessage() }}
      </div>
    }

    <form class="auth-form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="new-password">Nouveau mot de passe (12 caractères min.) *</label>
        <div class="input-password-wrapper">
          <input
            id="new-password"
            [type]="showPassword() ? 'text' : 'password'"
            name="newPassword"
            [ngModel]="newPassword()"
            (ngModelChange)="onPasswordChange($event)"
            placeholder="••••••••••••"
            required
            autocomplete="new-password"
          />
          <button
            type="button"
            class="btn-toggle-pwd"
            (click)="toggleShowPassword()"
            [attr.aria-label]="showPassword() ? 'Masquer' : 'Afficher'"
          >
            {{ showPassword() ? 'Masquer' : 'Afficher' }}
          </button>
        </div>

        @if (newPassword().length > 0) {
          <div class="strength-meter">
            <div class="strength-bar-bg">
              <div
                class="strength-bar-fill"
                [style.width.%]="strengthScore()"
                [style.background-color]="strengthLabel().color"
              ></div>
            </div>
            <div class="strength-label">
              <span>Force :</span>
              <span [style.color]="strengthLabel().color">{{ strengthLabel().label }}</span>
            </div>
          </div>
        }
      </div>

      <div class="form-group">
        <label for="confirm-new-password">Confirmer le nouveau mot de passe *</label>
        <div class="input-password-wrapper">
          <input
            id="confirm-new-password"
            [type]="showConfirmPassword() ? 'text' : 'password'"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="••••••••••••"
            required
            autocomplete="new-password"
          />
          <button
            type="button"
            class="btn-toggle-pwd"
            (click)="toggleShowConfirmPassword()"
            [attr.aria-label]="showConfirmPassword() ? 'Masquer' : 'Afficher'"
          >
            {{ showConfirmPassword() ? 'Masquer' : 'Afficher' }}
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-block"
        [disabled]="loading() || !token || newPassword().length < 12 || !passwordsMatch()"
      >
        @if (loading()) {
          <span class="spinner"></span> Mise à jour...
        } @else {
          Enregistrer le mot de passe
        }
      </button>

      <div class="auth-footer">
        <a routerLink="/login" class="link-register">← Revenir à la connexion</a>
      </div>
    </form>
  </div>
</div>
